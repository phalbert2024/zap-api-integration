name: Deploy to Staging

on:
  push:
    branches: [develop]

permissions:
  contents: read

jobs:
  deploy-backend:
    name: Deploy Backend to Staging
    runs-on: ubuntu-latest
    environment: staging
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
      
      - name: Install dependencies
        run: npm ci
        working-directory: ./backend
      
      - name: Build
        run: npm run build
        working-directory: ./backend
        env:
          NODE_ENV: staging
      
      - name: Deploy to Firebase Functions (Staging)
        uses: w9jds/firebase-action@master
        with:
          args: deploy --only functions --project staging
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN_STAGING }}
      
      - name: Notify deployment
        uses: 8398a7/action-slack@v3
        if: always()
        with:
          status: ${{ job.status }}
          text: 'Backend deployment to staging'
          webhook_url: ${{ secrets.SLACK_WEBHOOK }}

  deploy-app:
    name: Deploy App to Staging
    runs-on: ubuntu-latest
    environment: staging
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
      
      - name: Install dependencies
        run: npm ci
        working-directory: ./app
      
      - name: Install Expo CLI
        run: npm install -g expo-cli
      
      - name: Publish to Expo (Staging)
        run: expo publish --release-channel staging
        working-directory: ./app
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      
      - name: Notify deployment
        uses: 8398a7/action-slack@v3
        if: always()
        with:
          status: ${{ job.status }}
          text: 'Mobile app deployment to staging'
          webhook_url: ${{ secrets.SLACK_WEBHOOK }}
